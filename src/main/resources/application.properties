spring.application.name=ai-knowledge-base

# =========================
# Ollama
# =========================

spring.ai.ollama.base-url=http://localhost:11434

# Chat Model
# 注意：think 必须配置在 options 下才能绑定到 OllamaChatOptions，
# 写在 spring.ai.ollama.chat.think 会被静默忽略，导致思考过程泄漏到答案中。
spring.ai.ollama.chat.options.model=qwen3:4b
spring.ai.ollama.chat.options.think=false

# Embedding Model
spring.ai.ollama.embedding.options.model=bge-m3


# =========================
# PostgreSQL
# =========================

spring.datasource.url=jdbc:postgresql://localhost:5432/ai_knowledge
spring.datasource.username=ai_user
spring.datasource.password=ai_password

spring.datasource.driver-class-name=org.postgresql.Driver


# =========================
# PGVector
# =========================

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE


# =========================
# 图片理解
# =========================

# 是否启用图片描述（关闭后图片抽取与落盘仍会跳过，直接不处理）
knowledge.vision.enabled=true

# 视觉模型：文档里的图表转成中文描述后进入向量库
knowledge.vision.model=qwen2.5vl:3b

# 单个文档最多描述多少张图，避免个别文档拖垮导入
knowledge.vision.max-images-per-document=20

# 抽取出的图片文件落盘目录（相对项目根目录）
knowledge.image.storage-path=data/images


# =========================
# 自进化闭环
# =========================

# 检索策略文件：由 evolution/auto_tune.py 在标注验证集上扫参选出（阈值/候选数/精排数）。
# 文件不存在或解析失败时回落到内置默认值（阈值 0.60 / Top5 / Top3），不会因策略问题起不来。
knowledge.policy.path=evaluation/selected_policy.json


# =========================
# 会话记忆（多轮对话）
# =========================

# 记忆开关：关闭后 /api/chat 退化为单轮无状态（与引入记忆前一致）
knowledge.memory.enabled=true

# 窗口保留轮数（一轮 = 一问一答）：超出时丢最旧的
knowledge.memory.max-turns=5

# 会话记忆的 TTL（秒）：30 分钟无交互自动过期，避免 Redis 里堆积僵尸会话
knowledge.memory.ttl-seconds=1800

# Redis key 前缀
knowledge.memory.key-prefix=kb:chat:

# 查询改写（指代消解）：仅在有历史对话时调用模型，失败自动回落到原问题
knowledge.memory.rewrite-enabled=true